*{box-sizing:border-box}

.app{display:flex;min-height:100vh}
nav{width:220px;background:#1f2a26;color:#e8ebe6;padding:16px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
nav h1{font-size:15px;padding:0 18px 14px;margin:0 0 8px;border-bottom:1px solid #34413c;line-height:1.4}
nav h1 small{display:block;color:#9fb0a8;font-weight:normal;font-size:11px;margin-top:2px}
nav a{display:block;padding:9px 18px;color:#cfd8d3;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#26332e}
nav a.active{background:#2b3833;color:#fff;border-left-color:var(--accent)}
nav .sep{height:1px;background:#34413c;margin:8px 18px}
nav .me{margin-top:auto;padding:12px 18px 0;border-top:1px solid #34413c;font-size:12px;color:#cfd8d3}
nav .me b{display:block;color:#fff;font-size:13px}
nav .me button{margin-top:8px;background:transparent;color:#cfd8d3;border-color:#4a5a53;font-size:12px;padding:4px 10px}
main{flex:1;padding:22px 28px 60px;min-width:0}
.demo{background:#fff4e5;border:1px solid #f0d2a8;color:#7a4a12;padding:8px 12px;border-radius:6px;margin-bottom:16px;font-size:12px}
.warnbar{background:#f7e1e1;border:1px solid #e3b5b5;color:#7d2323;padding:8px 12px;border-radius:6px;margin-bottom:14px;font-size:13px}
h2{margin:0 0 4px;font-size:20px}
h3{font-size:15px;margin:22px 0 10px}
.lead{color:var(--muted);margin:0 0 16px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,select,input,textarea{font:inherit}
button{padding:7px 14px;border-radius:6px;border:1px solid #cfd3cc;background:#fff;cursor:pointer;color:var(--ink)}
button:hover{background:#f2f3f0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#a9471a}
button.small{padding:3px 9px;font-size:12px}
button.danger{color:var(--ng)}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{padding:6px 8px;border:1px solid #cfd3cc;border-radius:5px;background:#fff;width:100%}
input:disabled,select:disabled{background:#f1f2ef;color:#777}
.toolbar select{width:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
th{background:#eef0ec;font-weight:600;font-size:12px;color:#444}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:170px}
td .sub{display:block;font-size:11px;color:var(--muted)}
tr.sel td{background:#fdf3ec}
.ops{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:24px;text-align:center;color:var(--muted)}
.nolink{color:var(--link);text-decoration:underline;cursor:pointer;font-weight:600}
.nolink.none{color:var(--muted);font-weight:normal}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card .label{font-size:12px;color:var(--muted)}
.card .value{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.card .note{font-size:11px;color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
@media (max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static}main{padding:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kv th{width:130px}
.bar-row{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar-track{background:#eef0ec;border-radius:4px;height:16px;overflow:hidden}
.bar{height:100%;border-radius:4px}
.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vbars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.vbar div{width:100%;max-width:46px;background:var(--accent2);border-radius:4px 4px 0 0;min-height:2px}
.vbar b{font-weight:600;color:var(--ink);font-size:10px;margin-bottom:2px}
.alerts{list-style:none;padding:0;margin:0}
.alerts li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.alerts li:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eceeea;color:#444;white-space:nowrap}

.prog .track{width:80px;height:8px;background:#eef0ec;border-radius:4px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}
.muted{color:var(--muted);font-size:12px}

.catlink{color:var(--link);cursor:pointer;text-decoration:underline}

.draftbar .grow{flex:1;min-width:220px}
.back{font-size:13px;color:var(--link);cursor:pointer;display:inline-block;margin-bottom:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,25,22,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:10px;width:100%;max-width:900px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dialog header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dialog header h4{margin:0;font-size:16px}
.dialog .body{padding:16px 18px}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.dialog footer .err{color:var(--ng);font-size:12px;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#444}
.fld.wide{grid-column:1/-1}
.items{margin-top:14px}
.items td{padding:4px 6px}
.items input,.items select{padding:4px 6px}
.w80{width:80px}.w60{width:60px}.w120{width:120px}.w130{width:130px}
.totals{margin-top:12px;display:flex;justify-content:flex-end}
.totals table{width:auto;min-width:280px;border:1px solid var(--line);border-radius:6px}
.totals td{padding:5px 12px}
.preview{margin-top:12px;background:#f6f7f4;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.preview:empty{display:none}
.toast{position:fixed;bottom:20px;right:20px;background:#1f2a26;color:#fff;padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
/* login */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:30px 16px}
#login.open{display:flex}

.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line)}

.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.loginbox .fld{margin-bottom:10px}
.loginbox .err{color:var(--ng);font-size:12px;min-height:18px}
/* print */
</style>
</head>

      const keys = Object.keys(cfg.fields).filter(k => JSON.stringify(o[k] ?? '') !== JSON.stringify(n[k] ?? ''));
      if (!keys.length) continue;

      let target = cfg.name, action = '変更';

      if (col === 'estimates') { if (!o.issued && n.issued) action = '発行'; else if (!o.trashed && n.trashed) action = 'ごみ箱へ移動'; else if (o.trashed && !n.trashed) action = 'ごみ箱から復元'; else if (o.status !== '受注' && n.status === '受注') action = '受注確定(採用)'; }

/* ============ パスワード(デモ用。ハッシュ化して保存) ============ */
async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (window.crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(h)).map(b => pad(b.toString(16), 2)).join(''); }
  let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619) >>> 0; } return 'fnv' + h.toString(16);
}
async function setPw(u, pw) { u.salt = uid() + uid(); u.hash = await hashPw(pw, u.salt); delete u.pw; }
async function migratePw() { let ch = false; for (const u of S.users) if (u.pw) { await setPw(u, u.pw); ch = true; } if (ch) save(); }

/* ============ 工事No・見積番号の採番 ============ */
const NUMBERING_RULES = {monthly: '支店記号 + yymm + 全社共通3桁連番(毎月リセット) 例:A2611001', fiscal: '支店記号 + 期 + ハイフン + 全社共通4桁連番(期首月にリセット) 例:A19-0001'};
function periodInfo(dateStr) {
  const n = S.settings.numbering, [y, m] = dateStr.split('-').map(Number);
  if (n.rule === 'fiscal') { const fy = m >= n.fiscalStartMonth ? y : y - 1; const period = Number(n.basePeriod) + (fy - Number(n.baseYear)); return {key: 'FY' + period, head: String(period) + '-', digits: 4, label: `第${period}期`}; }
  return {key: String(y).slice(2) + pad(m, 2), head: String(y).slice(2) + pad(m, 2), digits: 3, label: `${y}年${m}月`};
}
const seqMax = pi => Math.pow(10, pi.digits) - 1;
const seqWarnAt = pi => pi.digits === 3 ? 900 : 9000;
function seqUsed(pi) { return S.seq[pi.key] || 0; }
// 本番ではデータベースのトランザクション(連番テーブルを行ロック)で採番する。
// デモでは採番の直前にブラウザ保存領域を読み直し、別タブで採番済みの番号と重複しないようにしている。
function allocateNo(branchCode) {
  const pi = periodInfo(today());
  let fresh = {}; try { fresh = (JSON.parse(localStorage.getItem(KEY)) || {}).seq || {}; } catch (e) {}
  const cur = Math.max(S.seq[pi.key] || 0, fresh[pi.key] || 0);
  if (cur >= seqMax(pi)) throw new Error(`${pi.label}の採番上限(${seqMax(pi)}件)に達しています`);
  const merged = {}; for (const k of new Set([...Object.keys(fresh), ...Object.keys(S.seq)])) merged[k] = Math.max(fresh[k] || 0, S.seq[k] || 0);
  merged[pi.key] = cur + 1; S.seq = merged; save();
  if (cur + 1 > seqWarnAt(pi)) setTimeout(() => toast(`注意:${pi.label}の連番が${cur + 1}件に達しました(上限${seqMax(pi)})`), 2700);
  return branchCode + pi.head + pad(cur + 1, pi.digits);
}

const activeEsts = dealId => S.estimates.filter(e => e.dealId === dealId && !e.trashed).sort((a, b) => (a.ver - b.ver) || a.createdAt.localeCompare(b.createdAt));
const latestEstimate = dealId => activeEsts(dealId).slice(-1)[0];
const nextVer = dealId => S.estimates.filter(e => e.dealId === dealId).reduce((m, e) => Math.max(m, e.ver || 0), 0) + 1;
function estCalc(e) {
  const sub = e.items.reduce((a, i) => a + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
  const exp = Math.round(sub * (Number(e.expenseRate) || 0) / 100);
  const net = sub + exp, tax = Math.floor(net * TAX);
  return {sub, exp, net, tax, total: net + tax};
}
const projInvoices = p => S.invoices.filter(i => i.projectId === p.id).sort((a, b) => a.cumRate - b.cumRate);
const projBilled = p => projInvoices(p).reduce((a, i) => a + i.amount, 0);
const projCum = p => projInvoices(p).reduce((m, i) => Math.max(m, i.cumRate), 0);
const projOrdered = p => S.orders.filter(o => o.projectId === p.id).reduce((a, o) => a + o.amount, 0);
const ordPayments = o => S.payments.filter(y => y.orderId === o.id).sort((a, b) => a.cumRate - b.cumRate);
const ordPaid = o => ordPayments(o).reduce((a, y) => a + y.amount, 0);
const ordCum = o => ordPayments(o).reduce((m, y) => Math.max(m, y.cumRate), 0);
/* 着工予定日・完工予定日=見積(受注)時点の予定。確定着工日・確定完工日=工程会議で確定した日(未来日も可・随時変更可) */
const projStage = p => (p.actualEnd && p.actualEnd <= today()) ? '完工' : (p.actualStart && p.actualStart <= today()) ? '施工中' : '着工前';
const projDone = p => projStage(p) === '完工';
/* 出来高:今回額 = 契約(発注)額 × 累計出来高率 − 既請求(既払)額 */
const progressAmount = (base, cumRate, done) => Math.round(base * cumRate / 100) - done;
const usersByRole = r => S.users.filter(u => u.active && u.role === r).map(u => u.name);

/* ============ モーダル(汎用フォーム) ============ */
let onModalCancel = null;
function openModal(title, html, onSave, saveLabel) {
  $('#modal-title').textContent = title; $('#modal-body').innerHTML = html; $('#modal-err').textContent = '';
  $('#modal-body').oninput = null; $('#modal-body').onchange = null; onModalCancel = null;
  const btn = $('#modal-save'); btn.textContent = saveLabel || '保存'; btn.disabled = false;
  btn.onclick = async () => { $('#modal-err').textContent = ''; const r = await onSave(); if (r !== false) { closeModal(); save(); render(); } };
  $('#modal').classList.add('open');
  const first = $('#modal-body input:not([type=radio]), #modal-body select'); if (first) first.focus();
}
function closeModal(cancelled) { $('#modal').classList.remove('open'); window._est = null; if (cancelled && onModalCancel) { const f = onModalCancel; onModalCancel = null; f(); } }
function err(msg) { $('#modal-err').textContent = msg; return false; }
function fieldsHtml(fields, v) {
  return fields.map(f => {
    const val = v[f.k] ?? f.def ?? '';
    let input;
    if (f.t === 'select') input = `<select name="${f.k}" ${f.dis ? 'disabled' : ''}>${f.o.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
    else if (f.t === 'textarea') input = `<textarea name="${f.k}" rows="3">${esc(val)}</textarea>`;
    else input = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(val)}" ${f.step ? `step="${f.step}"` : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.list ? `list="${f.k}-list"` : ''} ${f.dis ? 'disabled' : ''} autocomplete="off">${f.list ? `<datalist id="${f.k}-list">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;
    return `<label class="fld ${f.wide ? 'wide' : ''}"><span>${esc(f.l)}${f.req ? ' *' : ''}</span>${input}</label>`;
  }).join('');
}
function readFields(fields) {
  const o = {};
  for (const f of fields) { const el = $(`#modal-body [name="${f.k}"]`); let v = el.value; if (f.t === 'number') v = v === '' ? '' : Number(v); o[f.k] = v; }
  return o;
}
function formModal(title, fields, v, onSave, preview, saveLabel) {
  openModal(title, `<div class="grid">${fieldsHtml(fields, v)}</div><div class="preview" id="modal-preview"></div>`, () => {
    const o = readFields(fields);
    for (const f of fields) if (f.req && (o[f.k] === '' || o[f.k] == null)) return err(`「${f.l}」を入力してください`);
    return onSave(o);
  }, saveLabel);
  if (preview) { const upd = () => { $('#modal-preview').innerHTML = preview(readFields(fields)); }; $('#modal-body').oninput = upd; $('#modal-body').onchange = upd; upd(); }
}
const projOptions = () => S.projects.map(p => [p.id, `${p.no} ${dealOf(p.dealId).title}`]);

/* ============ 画面:ダッシュボード ============ */
function numberingWarn() {
  const pi = periodInfo(today()), used = seqUsed(pi);
  return used > seqWarnAt(pi) ? `<div class="warnbar">⚠ ${pi.label}の工事No連番が <b>${used}件</b> に達しています(上限 ${seqMax(pi)}件)。採番ルールの見直しを検討してください。</div>` : '';
}
function vDash() {
  const open = S.deals.filter(dealOpen);
  const pipeline = open.reduce((a, d) => { const e = latestEstimate(d.id); return a + (e ? estCalc(e).net : 0); }, 0);
  const contractTotal = S.projects.reduce((a, p) => a + p.contract, 0);
  const backlog = S.projects.reduce((a, p) => a + p.contract - projBilled(p), 0);
  const ym = today().slice(0, 7);
  const monthBill = S.invoices.filter(i => i.date.startsWith(ym)).reduce((a, i) => a + i.amount, 0);
  const ordered = S.orders.reduce((a, o) => a + o.amount, 0);
  const unpaid = S.orders.reduce((a, o) => a + o.amount - ordPaid(o), 0);
  const won = S.deals.filter(d => d.status === '受注').length, lost = S.deals.filter(d => d.status === '失注').length;
  const gross = contractTotal - ordered;
  const teamRows = TEAMS.map(t => {
    const pl = open.filter(d => d.team === t).reduce((a, d) => { const e = latestEstimate(d.id); return a + (e ? estCalc(e).net : 0); }, 0);
    const wn = S.projects.filter(p => dealOf(p.dealId).team === t).reduce((a, p) => a + p.contract, 0);
    return {t, pl, wn};
  });
  const tmax = Math.max(1, ...teamRows.flatMap(r => [r.pl, r.wn]));
  const teamHtml = teamRows.map(r => `
    <div class="bar-row"><span>${esc(r.t)}<span class="muted"> 見込</span></span><div class="bar-track"><div class="bar" style="width:${r.pl / tmax * 100}%;background:#d9895e"></div></div><span class="num">${man(r.pl)}</span></div>
    <div class="bar-row"><span><span class="muted">　　　　 受注</span></span><div class="bar-track"><div class="bar" style="width:${r.wn / tmax * 100}%;background:var(--accent2)"></div></div><span class="num">${man(r.wn)}</span></div>`).join('');
  const now = new Date(); const months = [];
  for (let k = 5; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push(d.getFullYear() + '-' + pad(d.getMonth() + 1, 2)); }
  const mv = months.map(m => S.invoices.filter(i => i.date.startsWith(m)).reduce((a, i) => a + i.amount, 0));
  const mmax = Math.max(1, ...mv);
  const monthHtml = months.map((m, i) => `<div class="vbar"><b>${mv[i] ? man(mv[i]) : ''}</b><div style="height:${mv[i] / mmax * 110}px"></div>${+m.slice(5)}月</div>`).join('');
  const al = [];
  const t = p => `${projLink(p)} ${esc(dealOf(p.dealId).title)}`;
  S.projects.filter(p => p.ec !== '締結済').forEach(p => al.push(`${badge(p.ec)} 電子契約が未締結:${t(p)}`));
  S.manifests.filter(m => m.status === '未登録').forEach(m => al.push(`${badge('未登録')} マニフェスト未登録:${t(projOf(m.projectId))} ${esc(m.waste)} ${m.qty}${esc(m.unit)}(${esc(m.date)})`));
  S.projects.filter(p => projCum(p) < 100 && projStage(p) === '施工中' && !S.invoices.some(i => i.projectId === p.id && i.date.startsWith(ym))).forEach(p => al.push(`${badge('施工中')} 今月の出来高請求が未作成:${t(p)}(累計 ${projCum(p)}%)`));
  S.projects.filter(p => !p.actualStart && p.start && p.start <= addDays(today(), 14)).forEach(p => al.push(`${badge('着工前')} 着工日が未確定(着工予定 ${esc(p.start)}${p.start < today() ? '・予定日超過' : '・2週間以内'}):${t(p)}`));
  S.projects.filter(p => projStage(p) === '施工中' && (p.actualEnd || p.end) < today()).forEach(p => al.push(`${badge('施工中')} ${p.actualEnd ? '確定' : ''}完工日(${esc(p.actualEnd || p.end)})を過ぎています。工程会議で確定完工日を見直してください:${t(p)}`));
  S.projects.filter(p => !projDone(p) && !p.crewName).forEach(p => al.push(`${badge('未定')} 施工担当が未定:${t(p)}`));
  S.deals.filter(d => d.status === '見込み' && !activeEsts(d.id).length).forEach(d => al.push(`${badge('見込み')} 見積未作成:${noLink(d)} ${esc(d.customer)}(確度 ${esc(d.prob)})`));
  S.estimates.filter(e => !e.trashed && e.status === '作成中' && dealOpen(dealOf(e.dealId))).forEach(e => al.push(`${badge('未発行')} 見積が未発行:${estLink(e)} ${esc(dealOf(e.dealId).customer)}`));
  S.estimates.filter(e => !e.trashed && e.status === '提出済' && e.issued && addDays(e.issued, e.validDays) < today()).forEach(e => al.push(`${badge('提出済')} 見積の有効期限切れ:${estLink(e)}`));
  return `${numberingWarn()}<h2>ダッシュボード</h2><p class="lead">${jpDate(today())} 時点の営業・工事・支払の状況</p>
  <div class="cards">
    <div class="card"><div class="label">商談中の見込み金額</div><div class="value">${man(pipeline)}</div><div class="note">${open.length}件(最新版見積の税抜額)</div></div>
    <div class="card"><div class="label">受注累計(税抜)</div><div class="value">${man(contractTotal)}</div><div class="note">受注率 ${won + lost ? Math.round(won / (won + lost) * 100) : 0}%(${won}勝${lost}敗)</div></div>
    <div class="card"><div class="label">受注残(未請求)</div><div class="value">${man(backlog)}</div><div class="note">契約額 − 請求済額</div></div>

    <div class="card"><div class="label">協力業者 未払残</div><div class="value">${man(unpaid)}</div><div class="note">発注額 − 支払済額</div></div>
    <div class="card"><div class="label">粗利見込み</div><div class="value">${man(gross)}</div><div class="note">粗利率 ${contractTotal ? (gross / contractTotal * 100).toFixed(1) : '0.0'}%</div></div>
  </div>
  <div class="two">
    <div class="panel"><h3 style="margin-top:0">部隊別 見込み/受注</h3><div class="legend"><span><i style="background:#d9895e"></i>見込み(商談中)</span><span><i style="background:var(--accent2)"></i>受注</span></div>${teamHtml}</div>
    <div class="panel"><h3 style="margin-top:0">月別 出来高請求額(税抜)</h3><div class="vbars">${monthHtml}</div></div>
  </div>
  <h3>要対応(${al.length}件)</h3>
  <div class="panel">${al.length ? `<ul class="alerts">${al.map(a => `<li>${a}</li>`).join('')}</ul>` : '<div class="empty">対応が必要な項目はありません</div>'}</div>`;
}

const XLSX_BTNS = `<button onclick="act.xlsxFor('')">📄 Excel見積書から登録</button><a class="muted" href="estimate_sample.xlsx" download>サンプルExcel</a>`;
let xlsxTarget = '';
async function unzip(buf) {

  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }

    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    files[name] = {method, data: u8.subarray(start, start + csize)};
    p += 46 + nlen + elen + clen;
  }

    const f = files[name]; if (!f) return null;
    if (f.method === 0) return dec.decode(f.data);
    const s = new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(s).text();

}
const xml = t => new DOMParser().parseFromString(t, 'application/xml');
const colNum = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n; };

    else if (t === 'str' || t === 'e') val = v ? v.textContent : '';

}
const norm = s => String(s ?? '').replace(/[\s ]/g, '').replace(/[((].*?[))]/g, '').replace(/[*※:]/g, '');

  const m = String(v || '').match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/); return m ? `${m[1]}-${pad(m[2], 2)}-${pad(m[3], 2)}` : '';

// 見出し(ラベル)を探し、その右側の値を読む方式なので、行位置が多少ずれても読める
function parseEstimateGrid(grid) {

  const label = name => { for (const r of rows) { const cols = Object.keys(grid[r]).map(Number).sort((a, b) => a - b); for (const c of cols) if (norm(grid[r][c]) === norm(name)) { const nx = cols.find(x => x > c && x <= c + 4); return nx ? grid[r][nx] : ''; } } return ''; };

  if (!hr) throw new Error('明細の見出し行(項目・数量・単価)が見つかりません');
  const col = {}; for (const [c, v] of Object.entries(grid[hr])) { const k = norm(v); if (['区分', 'カテゴリ', '項目', '数量', '単位', '単価'].includes(k)) col[k === 'カテゴリ' ? '区分' : k] = +c; }

    const g = grid[r], name = String(g[col['項目']] ?? '').trim();
    if (/^(小計|合計|税抜合計|諸経費)/.test(norm(name)) || /^(小計|合計)/.test(norm(g[1]))) break;
    const qty = toNum(g[col['数量']]), price = toNum(g[col['単価']]);
    if (!name && isNaN(price)) continue;
    if (!name) { warn.push(`${r}行目:項目名が空のため読み飛ばしました`); continue; }
    if (isNaN(qty) || isNaN(price)) warn.push(`${r}行目「${name}」:数量または単価が数値でないため 0 としました`);
    let cat = col['区分'] ? String(g[col['区分']] ?? '').trim() : '';
    if (!CATS.includes(cat)) { const c2 = autoCat(name); if (cat) warn.push(`${r}行目「${name}」:区分「${cat}」は一覧にないため「${c2}」としました`); cat = c2; }

  }
  let expenseRate = toNum(label('諸経費率')); if (isNaN(expenseRate)) { expenseRate = 0; warn.push('諸経費率が読めないため 0% としました'); } else if (expenseRate > 0 && expenseRate < 1) expenseRate = Math.round(expenseRate * 1000) / 10;
  let structure = String(label('構造')).trim(); if (!STRUCTS.includes(structure)) { if (structure) warn.push(`構造「${structure}」は一覧にないため「その他」としました`); structure = 'その他'; }
  let team = String(label('担当部隊')).trim(); if (!TEAMS.includes(team)) { const t2 = /公共|大規模|RC|入札/.test(team) ? TEAMS[1] : TEAMS[0]; if (team) warn.push(`担当部隊「${team}」を「${t2}」と判断しました`); team = t2; }
  let source = String(label('流入経路')).trim(); if (!SOURCES.includes(source)) source = 'その他';
  const bName = String(label('発行支店')).trim(); let br = branchByName(bName);
  if (!br) { br = S.branches[0]; warn.push(bName ? `発行支店「${bName}」は設定にないため「${br.name}」としました` : `発行支店が空欄のため「${br.name}」としました`); }

}

      if (est.issued && d.status === '見込み') d.status = '見積提出';
      detailSel[d.id] = id; xlsxTarget = ''; toast(`${d.no} に見積 ${no} を登録しました`); setTimeout(() => openDetail(d.id, id), 0);
    }, errs.length ? '登録できません' : 'この内容で登録');
    if (errs.length) $('#modal-save').disabled = true;
  },
  logCsv() { if (!canSeeLogs()) return; const rows = [['日時', '操作者', '職種', '対象', '工事No・対象名', '操作', '項目', '変更前', '変更後']]; filteredLogs().forEach(l => (l.changes.length ? l.changes : [{label: '', before: '', after: ''}]).forEach(c => rows.push([l.at, l.user, l.role, l.target, l.ref, l.action, c.label, c.before, c.after]))); downloadCsv('変更履歴_' + today() + '.csv', rows); },
  /* --- データ --- */
  exportJson() { download('kaitai-sms-data_' + today() + '.json', JSON.stringify(S, null, 2), 'application/json'); },
  importJson(input) { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = async () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.deals)) throw 0; SNAP = null; S = d; normalize(); await migratePw(); addLog('データ', f.name, 'JSON読み込み(全データ置換)', []); snap(); save(); if (ME && !S.users.some(u => u.id === ME.id)) act.logout(); else render(); toast('読み込みました'); } catch (e) { toast('読み込めないファイルです'); } input.value = ''; }; r.readAsText(f); },
  async reset() { if (confirm('入力したデータを消して、サンプルデータに戻しますか?(アカウントもサンプルに戻り、ログアウトします)')) { SNAP = null; S = sample(); await migratePw(); snap(); save(); act.logout(); toast('サンプルデータに戻しました'); } }
};
function catSync() { const e = window._est; if (!e) return; syncItems(e.items); const s = e.items.reduce((a, i) => a + i.qty * i.price, 0); const c = $('#cat-sub'); if (c) c.textContent = yen(s); }
// 行追加などの共通ボタンは、カテゴリ編集中もそのまま使う
const _rowAdd = act.rowAdd, _rowPreset = act.rowPreset, _rowDel = act.rowDel;
act.rowAdd = () => { if (window._est && window._est.cat) { catSync(); window._est.items.push(blankRow(window._est.cat)); window._estReopen(); } else _rowAdd(); };
act.rowPreset = i => { if (window._est && window._est.cat) { catSync(); const p = PRESETS[i], its = window._est.items; if (its.length === 1 && !its[0].name && !its[0].price) its.pop(); its.push({cat: p[0], name: p[1], unit: p[2], qty: p[3], price: p[4]}); window._estReopen(); } else _rowPreset(i); };
act.rowDel = i => { if (window._est && window._est.cat) { catSync(); window._est.items.splice(i, 1); if (!window._est.items.length) window._est.items.push(blankRow(window._est.cat)); window._estReopen(); } else _rowDel(i); };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function downloadCsv(name, rows) { const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); download(name, '﻿' + csv, 'text/csv'); }

/* ============ 画面切替 ============ */
const VIEWS = {dashboard:['ダッシュボード', vDash], deals:['見込み客・案件', vDeals], estimates:['見積', vEstimates], projects:['受注工事・電子契約', vProjects], schedule:['工程会議', vSchedule], billing:['出来高請求', vBilling], subs:['協力業者・支払', vSubs], manifests:['マニフェスト', vManifests],
  '-1':null, trash:['ごみ箱', vTrash], logs:['変更履歴', vLogs], accounts:['アカウント', vAccounts], settings:['設定', vSettings], data:['データ管理', vData]};
let view = 'dashboard';
function parseHash() { const h = decodeURIComponent(location.hash.slice(1)); if (h.startsWith('detail/')) { detailId = h.slice(7); return 'detail'; } return (h in VIEWS && VIEWS[h]) ? h : 'dashboard'; }
function go(v) { if (location.hash.slice(1) !== v) location.hash = v; else { view = parseHash(); render(); } window.scrollTo(0, 0); }
function render() {
  if (!ME) { renderLogin(); return; }
  $('#login').classList.remove('open'); $('.app').style.display = '';
  $('#nav').innerHTML = Object.entries(VIEWS).filter(([k]) => k !== 'logs' || canSeeLogs()).map(([k, v]) => v ? `<a class="${k === view ? 'active' : ''}" onclick="go('${k}')">${v[0]}${k === 'trash' && S.estimates.some(e => e.trashed) ? ` <span class="badge b-gray">${S.estimates.filter(e => e.trashed).length}</span>` : ''}</a>` : '<div class="sep"></div>').join('');
  $('#me').innerHTML = `<b>${esc(ME.name)}</b>${badge(ME.role)} <span class="muted" style="color:#9fb0a8">${esc(branchOf(ME.branch).name)}</span><br><button onclick="act.logout()">ログアウト</button>`;
  if (view === 'detail') { $('#view').innerHTML = vDetail(); document.title = (dealOf(detailId).no || '案件照会') + ' | 解体工事 販売管理システム(デモ)'; return; }
  $('#view').innerHTML = VIEWS[view][1]();
  document.title = VIEWS[view][0] + ' | 解体工事 販売管理システム(デモ)';
}
window.addEventListener('hashchange', () => { view = parseHash(); closeModal(); render(); window.scrollTo(0, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal(true); });
window.addEventListener('storage', e => { if (e.key === KEY) { load(); snap(); if (ME) ME = S.users.find(u => u.id === ME.id) || null; render(); } });
(async function init() {
  load(); await migratePw(); snap();
  let sid = null; try { sid = sessionStorage.getItem(SKEY); } catch (e) {}
  ME = S.users.find(u => u.id === sid && u.active) || null;
  view = parseHash(); render();
})();
</script>
</body>
